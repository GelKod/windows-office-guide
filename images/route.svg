<svg xmlns="http://www.w3.org/2000/svg" width="900" height="521" viewBox="0 0 900 521" role="img" aria-label="Твой маршрут"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#153047}.label{font-size:21px;font-weight:700}.detail{font-size:17px}</style><rect width="900" height="521" rx="22" fill="#f0f5fa"/><text x="34" y="48" font-size="28" font-weight="700">Твой маршрут</text><text x="34" y="84" font-size="17">Флешка уже готова. Начни с её подключения к ПК.</text><rect x="34" y="125" width="832" height="78" rx="14" fill="#d9eafa"/><text x="56" y="154" class="label">01 · Сохранить важное</text><text x="56" y="181" class="detail">Проверенная копия файлов на отдельном носителе.</text><rect x="34" y="219" width="832" height="78" rx="14" fill="#e5dff8"/><text x="56" y="248" class="label">02 · Выбрать сценарий</text><text x="56" y="275" class="detail">Удалить всё → А. Сохранить программы → Б1. Только файлы → Б2.</text><rect x="34" y="313" width="832" height="78" rx="14" fill="#d9eee7"/><text x="56" y="342" class="label">03 · Установить Windows</text><text x="56" y="369" class="detail">Boot Menu → готовая флешка → целевой диск → установка.</text><rect x="34" y="407" width="832" height="78" rx="14" fill="#f9ead2"/><text x="56" y="436" class="label">04 · Подготовить компьютер к работе</text><text x="56" y="463" class="detail">Обновления → драйверы → Office → проверка активации.</text></svg>