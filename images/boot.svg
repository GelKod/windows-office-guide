<svg xmlns="http://www.w3.org/2000/svg" width="900" height="427" viewBox="0 0 900 427" role="img" aria-label="Boot Menu: что выбрать"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#153047}.label{font-size:21px;font-weight:700}.detail{font-size:17px}</style><rect width="900" height="427" rx="22" fill="#f0f5fa"/><text x="34" y="48" font-size="28" font-weight="700">Boot Menu: что выбрать</text><text x="34" y="84" font-size="17">Условный пример. Реальные названия зависят от компьютера.</text><rect x="34" y="125" width="832" height="78" rx="14" fill="#ccebdd"/><text x="56" y="154" class="label">UEFI: USB Flash, Partition 1  ← ВЫБРАТЬ</text><text x="56" y="181" class="detail">Для запуска установщика: стрелки ↑ ↓, затем Enter.</text><rect x="34" y="219" width="832" height="78" rx="14" fill="#d9eafa"/><text x="56" y="248" class="label">Windows Boot Manager (внутренний SSD)</text><text x="56" y="275" class="detail">После установки выбирай этот пункт, чтобы запустить Windows.</text><rect x="34" y="313" width="832" height="78" rx="14" fill="#e5e9ee"/><text x="56" y="342" class="label">Network / PXE / IPv4 / IPv6</text><text x="56" y="369" class="detail">Загрузка по сети — для этого руководства не нужна.</text></svg>