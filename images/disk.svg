<svg xmlns="http://www.w3.org/2000/svg" width="900" height="427" viewBox="0 0 900 427" role="img" aria-label="Разделы диска: остановись и проверь"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#153047}.label{font-size:21px;font-weight:700}.detail{font-size:17px}</style><rect width="900" height="427" rx="22" fill="#f0f5fa"/><text x="34" y="48" font-size="28" font-weight="700">Разделы диска: остановись и проверь</text><text x="34" y="84" font-size="17">Это пример с двумя дисками. В нём целевой SSD — Диск 1.</text><rect x="34" y="125" width="832" height="78" rx="14" fill="#d9eafa"/><text x="56" y="154" class="label">Диск 0 · Другой накопитель · СОХРАНИТЬ</text><text x="56" y="181" class="detail">Его разделы не удаляем. Номер 0 не означает «диск Windows».</text><rect x="34" y="219" width="832" height="78" rx="14" fill="#f6d8d9"/><text x="56" y="248" class="label">Диск 1 · Целевой SSD · УДАЛИТЬ ТОЛЬКО В ВАРИАНТЕ А</text><text x="56" y="275" class="detail">Сначала сверить модель, объём и наличие резервной копии.</text><rect x="34" y="313" width="832" height="78" rx="14" fill="#ccebdd"/><text x="56" y="342" class="label">Диск 1 · Незанятое пространство → Далее</text><text x="56" y="369" class="detail">Windows создаст нужные разделы автоматически.</text></svg>